# Murphy Lab people. Each entry renders as one row; photo side alternates
# (odd entries: photo right / text left — like demo card 1; even: photo left / text right).
# To add a member: copy a block, edit the fields, save their photo into assets/img/
# (lowercase, no spaces), git add the photo, then commit & push.
# Short or empty bios are fine — write "Coming soon" or leave bio blank.

- name: "Sean Murphy"
  position: "Principal Investigator"
  image: "sean_murphy_profile.jpeg"
  linkedin: "https://www.linkedin.com/in/sean-murphy-3741bb49/"
  bio: >
    I grew up in Mandurah, Western Australia, and completed my PhD at Monash
    University in Melbourne, where I studied stem cells as a treatment for lung
    disease. This early translational work set the direction for my research:
    developing new treatments to help people with disease and injury. I joined the
    Wake Forest Institute for Regenerative Medicine in 2011, where I now lead a lab
    working across tissue engineering, regenerative medicine, and organ-on-a-chip
    systems. Our projects range from burn and wound healing to the development of
    novel human in vitro models and the discovery and testing of new therapies for a
    range of diseases and injuries. Outside the lab, I enjoy spending time with my
    wife and two kids, restoring my classic car, and playing music and nerdy games
    with friends.

